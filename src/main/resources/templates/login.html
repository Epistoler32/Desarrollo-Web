<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Island+Moments&family=Fuzzy+Bubbles:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/styles/auth.css}" />
    <title>Iniciar Sesión – SeaSide</title>
  </head>
  <body>

    <!-- ─── NAVBAR ──────────────────────────────────────────── -->
    <header class="navigation-bar" id="navbar">
      <figure class="logo">
        <img th:src="@{/resources/IMGS/seasideLogo.png}" alt="Logo SeaSide" />
      </figure>
      <nav>
        <ul class="nav-links">
          <li><a class="page-link" href="/">Home</a></li>
          <li><a class="page-link" href="/menu">Menú</a></li>
          <li><a class="login-link" href="/signup">Crear cuenta</a></li>
        </ul>
      </nav>
    </header>

    <!-- ─── HERO ─────────────────────────────────────────────── -->
    <div class="auth-hero">
      <div class="auth-hero-overlay"></div>
      <div class="auth-hero-content">
        <h1 class="auth-hero-title">Bienvenido</h1>
      </div>
      <div class="hero-wave">
        <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
          <path d="M0,60 C360,120 1080,0 1440,60 L1440,120 L0,120 Z" />
        </svg>
      </div>
    </div>

    <!-- ─── FORMULARIO ───────────────────────────────────────── -->
    <main class="auth-main">
      <div class="auth-card">
        <h2 class="auth-title">Iniciar sesión</h2>

        <div class="auth-error" th:if="${error}" th:text="${error}"></div>

        <form class="auth-form" method="post" action="/login">
          <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="correo@ejemplo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="contrasena">Contraseña</label>
            <input
              type="password"
              id="contrasena"
              name="contrasena"
              placeholder="Tu contraseña"
              required
            />
          </div>

          <button type="submit" class="auth-btn">Ingresar</button>
        </form>

        <p class="auth-switch">
          ¿No tienes cuenta? <a href="/signup">Regístrate</a>
        </p>
      </div>
    </main>

    <footer class="auth-footer">
      <p>© 2026 SeaSide. All rights reserved.</p>
    </footer>

    <script th:src="@{/js/navbar.js}"></script>
  </body>
</html>
