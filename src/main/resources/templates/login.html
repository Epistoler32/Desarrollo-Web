<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Island+Moments&family=Fuzzy+Bubbles:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- navbar, hero, colores de marca -->
    <link rel="stylesheet" th:href="@{/styles/auth.css}" />
    <title>Iniciar Sesión – SeaSide</title>
  </head>
  <body>
    <!-- ─── NAVBAR ──────────────────────────────────────────── -->
    <header class="navigation-bar" id="navbar">
      <figure class="logo">
        <img th:src="@{/resources/IMGS/seasideLogo.png}" alt="Logo SeaSide" />
      </figure>
      <nav>
        <ul class="nav-links">
          <li><a class="page-link" href="/">Home</a></li>
          <li><a class="page-link" href="/menu">Menú</a></li>
          <li><a class="login-link" href="/signup">Crear cuenta</a></li>
        </ul>
      </nav>
    </header>

    <!-- ─── HERO ────────────────────────────────────────────── -->
    <div class="auth-hero">
      <div class="auth-hero-overlay"></div>
      <div class="auth-hero-content">
        <h1 class="auth-hero-title">Bienvenido</h1>
      </div>
      <div class="hero-wave">
        <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
          <path d="M0,60 C360,120 1080,0 1440,60 L1440,120 L0,120 Z" />
        </svg>
      </div>
    </div>

    <!-- ─── FORMULARIO (Bootstrap) ──────────────────────────── -->
    <main class="auth-main">
      <div class="auth-card">
        <h2 class="auth-title">Iniciar sesión</h2>

        <!-- Bootstrap alert de error -->
        <div
          class="alert alert-danger"
          role="alert"
          th:if="${error}"
          th:text="${error}"
        ></div>

        <form method="post" action="/login">
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input
              type="email"
              class="form-control"
              id="correo"
              name="correo"
              placeholder="correo@ejemplo.com"
              required
            />
          </div>

          <div class="mb-4">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="contrasena"
              name="contrasena"
              placeholder="Tu contraseña"
              required
            />
          </div>

          <!-- d-grid hace que el botón ocupe todo el ancho -->
          <div class="d-grid">
            <button type="submit" class="btn auth-btn">Ingresar</button>
          </div>
        </form>

        <p class="auth-switch">
          ¿No tienes cuenta? <a href="/signup">Regístrate</a>
        </p>
      </div>
    </main>

    <footer class="auth-footer">
      <p>© 2026 SeaSide. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/navbar.js}"></script>
  </body>
</html>
