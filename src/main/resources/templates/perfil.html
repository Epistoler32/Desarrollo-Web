<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Island+Moments&family=Fuzzy+Bubbles:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/styles/auth.css}" />
    <link rel="stylesheet" th:href="@{/styles/profile.css}" />
    <title>Mi Perfil - SeaSide</title>
  </head>
  <body>
    <header class="navigation-bar" id="navbar">
      <figure class="logo">
        <img th:src="@{/resources/IMGS/seasideLogo.png}" alt="Logo SeaSide" />
      </figure>
      <nav>
        <ul class="nav-links">
          <li><a class="page-link" href="/">Home</a></li>
          <li><a class="page-link" href="/menu">Menú</a></li>
          <li><a class="page-link" href="/clients/profile">Perfil</a></li>
          <li><a class="login-link" href="/logout">Cerrar sesión</a></li>
        </ul>
      </nav>
    </header>

    <div class="auth-hero">
      <div class="auth-hero-overlay"></div>
      <div class="auth-hero-content">
        <h1 class="auth-hero-title">Mi Perfil</h1>
      </div>
    </div>

    <main class="auth-main">
      <div class="auth-card profile-card">
        <div class="profile-row">
          <span class="profile-label">Nombre</span>
          <span th:text="${client.nombre}"></span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Apellido</span>
          <span th:text="${client.apellido}"></span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Correo</span>
          <span th:text="${client.correo}"></span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Teléfono</span>
          <span th:text="${client.telefono}"></span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Dirección</span>
          <span th:text="${client.direccion}"></span>
        </div>

        <div class="profile-actions">
          <a
            th:href="@{/clients/update/{id}(id=${client.id})}"
            class="auth-btn"
          >
            Editar Perfil
          </a>
          <a
            th:href="@{/clients/delete/{id}(id=${client.id})}"
            class="auth-btn"
            style="background: linear-gradient(135deg, #730202, #c81e1e);"
            onclick="return confirm('¿Estás seguro de que deseas eliminar tu cuenta? Esta acción no se puede deshacer.');"
          >
            Eliminar Cuenta
          </a>
        </div>
      </div>
    </main>

    <footer class="auth-footer">
      <p>© 2026 SeaSide. All rights reserved.</p>
    </footer>

    <script th:src="@{/js/navbar.js}"></script>
  </body>
</html>
